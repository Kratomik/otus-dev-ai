name: Deploy Frontend to GitHub Pages

on:
  # Любой push в master/main — пересборка Pages (secrets подхватываются заново).
  # Раньше был paths: frontend/** — пустые коммиты и правки только Readme/корня workflow не запускали.
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      vite_supabase_url:
        description: "Override VITE_SUPABASE_URL (optional; else secret/variable)"
        required: false
        type: string
      vite_supabase_anon_key:
        description: "Override VITE_SUPABASE_ANON_KEY (optional; else secret)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54329
      VITE_SUPABASE_ANON_KEY: sb-publishable-test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    env:
      # Repository variable or secret; workflow_dispatch can override URL
      VITE_SUPABASE_URL: ${{ inputs.vite_supabase_url || vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ inputs.vite_supabase_anon_key || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_YANDEX_METRIKA_ID: ${{ secrets.VITE_YANDEX_METRIKA_ID }}
    outputs:
      app_url: ${{ steps.pages.outputs.app_url }}
      login_url: ${{ steps.pages.outputs.login_url }}
      vite_base: ${{ steps.pages.outputs.vite_base }}
      is_user_site: ${{ steps.pages.outputs.is_user_site }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve GitHub Pages base path
        id: pages
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "vite_base=/" >> "$GITHUB_OUTPUT"
            echo "is_user_site=true" >> "$GITHUB_OUTPUT"
            echo "app_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "login_url=https://${OWNER}.github.io/#/login" >> "$GITHUB_OUTPUT"
          else
            echo "vite_base=/${REPO}/" >> "$GITHUB_OUTPUT"
            echo "is_user_site=false" >> "$GITHUB_OUTPUT"
            echo "app_url=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_OUTPUT"
            echo "login_url=https://${OWNER}.github.io/${REPO}/#/login" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase env for Pages build
        run: node scripts/verify-supabase-build-env.mjs

      - name: Build for GitHub Pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.vite_base }}
        run: npm run build:pages

      - name: Verify Supabase config in dist
        run: npm run build:pages:verify

      - name: Verify dist output
        env:
          REPO: ${{ github.event.repository.name }}
          VITE_BASE: ${{ steps.pages.outputs.vite_base }}
          IS_USER_SITE: ${{ steps.pages.outputs.is_user_site }}
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          if [ "$IS_USER_SITE" = "true" ]; then
            if grep -q "/${REPO}/assets" dist/index.html 2>/dev/null; then
              echo "::error::User site (owner.github.io) must use base /, not /${REPO}/"
              exit 1
            fi
          else
            if ! grep -q "/${REPO}/" dist/index.html; then
              echo "::error::Project site must embed /${REPO}/ in index.html (VITE_BASE_PATH)."
              head -30 dist/index.html
              exit 1
            fi
          fi
          echo "dist OK (base=${VITE_BASE})"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/frontend/dist

      - name: Deployment URL summary
        env:
          APP_URL: ${{ steps.pages.outputs.app_url }}
          LOGIN_URL: ${{ steps.pages.outputs.login_url }}
          IS_USER_SITE: ${{ steps.pages.outputs.is_user_site }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          WRONG="https://${OWNER}.github.io/#/login"
          {
            echo "## GitHub Pages"
            echo ""
            echo "**Откройте приложение:** [\`${LOGIN_URL}\`](${LOGIN_URL})"
            echo ""
            if [ "$IS_USER_SITE" != "true" ]; then
              echo "> Репозиторий \`${REPO}\` — это **project site**. URL **обязан** содержать \`/${REPO}/\`."
              echo "> ❌ \`${WRONG}\` — GitHub 404 (корень \`github.io\` — другой сайт)."
              echo ""
            fi
            echo "| Параметр | Значение |"
            echo "|----------|----------|"
            echo "| \`VITE_BASE_PATH\` | \`${{ steps.pages.outputs.vite_base }}\` |"
            echo "| \`VITE_SUPABASE_URL\` | задан при сборке (secret/variable) |"
            echo "| Settings → Pages | Source: **GitHub Actions** |"
            echo ""
            echo "### Supabase на Pages"
            echo ""
            echo "Если на сайте «Supabase не настроен» — в **Settings → Secrets and variables → Actions** добавьте:"
            echo ""
            echo "| Имя | Значение |"
            echo "|-----|----------|"
            echo "| \`VITE_SUPABASE_ANON_KEY\` | \`ANON_KEY\` из \`backend/.env\` |"
            echo "| \`VITE_SUPABASE_URL\` | публичный URL Kong (не \`localhost\` для чужих браузеров) |"
            echo ""
            echo "После сохранения secrets: **Actions → Deploy Frontend to GitHub Pages → Run workflow**."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Published URLs
        env:
          LOGIN_URL: ${{ needs.build.outputs.login_url }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Deployed"
            echo "- Actions URL: \`${PAGE_URL}\`"
            echo "- **Login:** [\`${LOGIN_URL}\`](${LOGIN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed: ${PAGE_URL}"
          echo "Open app: ${LOGIN_URL}"
