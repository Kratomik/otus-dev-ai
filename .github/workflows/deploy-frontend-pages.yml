name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Project Pages (не user site):
#   https://<owner>.github.io/<repo>/#/login
#   https://kratomik.github.io/otus-dev-ai/#/login
# Неверно: https://kratomik.github.io/#/login  → 404 GitHub (другой сайт, нет /otus-dev-ai/)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54329
      VITE_SUPABASE_ANON_KEY: sb-publishable-test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_YANDEX_METRIKA_ID: ${{ secrets.VITE_YANDEX_METRIKA_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Verify Pages base path in dist
        run: |
          REPO="${{ github.event.repository.name }}"
          if ! grep -q "/${REPO}/" dist/index.html; then
            echo "::error::index.html must reference assets under /${REPO}/ (VITE_BASE_PATH). Check VITE_BASE_PATH in workflow."
            grep -E 'src=|href=' dist/index.html | head -20 || true
            exit 1
          fi
          test -f dist/404.html
          test -f dist/.nojekyll
          echo "Base path /${REPO}/ verified in dist/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deployment URL (correct vs wrong)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          CORRECT="https://${OWNER}.github.io/${REPO}/#/login"
          WRONG="https://${OWNER}.github.io/#/login"
          {
            echo "## GitHub Pages — откройте приложение"
            echo ""
            echo "| | URL |"
            echo "|---|-----|"
            echo "| ✅ **Верно** | \`${CORRECT}\` |"
            echo "| ❌ **404** | \`${WRONG}\` (нет \`/${REPO}/\` в пути) |"
            echo ""
            echo "Настройки репозитория: **Settings → Pages → Source: GitHub Actions**."
            echo "Секреты: \`VITE_SUPABASE_URL\`, \`VITE_SUPABASE_ANON_KEY\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Published URL
        run: |
          echo "Deployed: ${{ steps.deployment.outputs.page_url }}"
          echo "Login: ${{ steps.deployment.outputs.page_url }}#/login"
