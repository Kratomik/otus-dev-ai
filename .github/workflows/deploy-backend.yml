name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend to server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BACKEND_SSH_HOST }}
          username: ${{ secrets.BACKEND_SSH_USER }}
          key: ${{ secrets.BACKEND_SSH_KEY }}
          port: ${{ secrets.BACKEND_SSH_PORT || '22' }}
          script: |
            set -e

            if [ ! -d "${{ secrets.BACKEND_DEPLOY_PATH }}" ]; then
              echo "Directory ${{ secrets.BACKEND_DEPLOY_PATH }} does not exist"
              exit 1
            fi

            cd "${{ secrets.BACKEND_DEPLOY_PATH }}"

            git fetch --all
            git checkout master
            git pull origin master

            cd backend
            docker compose pull
            docker compose up -d --remove-orphans
