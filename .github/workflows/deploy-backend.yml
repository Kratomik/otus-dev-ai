# Развёртывание self-hosted Supabase (backend/docker-compose.yml) на self-hosted runner.
# Требования на runner: labels linux + backend, Docker и Compose v2, файл backend/.env (не в git).
name: Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend on self-hosted runner
    runs-on:
      - self-hosted
      - linux
      - backend
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker and Compose versions
        working-directory: backend
        run: |
          docker version
          docker compose version

      - name: Validate Compose configuration
        working-directory: backend
        run: docker compose config -q

      - name: Pull images and start stack
        working-directory: backend
        run: |
          set -euo pipefail
          docker compose pull
          docker compose up -d --remove-orphans --wait

      - name: Service status
        working-directory: backend
        run: docker compose ps -a
