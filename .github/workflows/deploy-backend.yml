# Постоянный бекенд (Docker Compose) на машине GitHub НЕ остаётся: job заканчивается — ВМ удаляется.
# Поэтому отдельный «деплой в Actions» без внешней платформы невозможен: здесь только проверка compose в CI.
# Реальный хостинг: свой VPS, Render/Railway/Fly (подключение репозитория в UI), или Supabase Cloud — без SSH-ключей в workflow.
#
# Настройки не нужны: используется закоммиченный backend/.env.example (шаблон Supabase, только для валидации).
name: Backend stack (compose check)

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-compose-ci
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose (env from .env.example)
        run: docker compose --env-file .env.example config -q
