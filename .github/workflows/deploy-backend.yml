# Постоянный бекенд (Docker Compose) на машине GitHub НЕ остаётся: job заканчивается — ВМ удаляется.
# Поэтому отдельный «деплой в Actions» без внешней платформы невозможен: здесь только проверка compose в CI.
# Реальный хостинг: свой VPS, Render/Railway/Fly (подключение репозитория в UI), или Supabase Cloud — без SSH-ключей в workflow.
#
# Настройки: backend/.env.example + LOGTAIL_SOURCE_TOKEN (заглушка для `compose config`, сервис monitoring).
name: Backend stack (compose check)

on:
  push:
    branches:
      - master
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-compose-ci
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Compose (env from .env.example)
        env:
          # log-aggregator (profile monitoring) требует непустой токен при `compose config`
          LOGTAIL_SOURCE_TOKEN: ci-compose-validation-only
        run: |
          docker compose --env-file .env.example config -q
          echo "Compose config OK"

      - name: Build health server (TypeScript)
        working-directory: backend/health
        run: |
          npm ci
          npm run build

      - name: Job summary
        run: |
          {
            echo "## Backend CI"
            echo "- \`docker compose config\` — OK"
            echo "- \`backend/health\` — \`npm run build\` OK"
            echo ""
            echo "Для Better Stack: задайте реальный \`LOGTAIL_SOURCE_TOKEN\` в \`backend/.env\` и \`docker compose --profile monitoring up -d log-aggregator\`"
          } >> "$GITHUB_STEP_SUMMARY"
